plugins { id 'com.android.application' }

android {
    namespace 'com.auroramusic.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.auroramusic.client'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            // Do not distribute unsigned release builds. Configure your own signing before publishing.
        }
    }
}
