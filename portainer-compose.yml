services:
  aurora:
    build: ./backend
    pull_policy: build
    container_name: aurora-music
    network_mode: host
    restart: unless-stopped
    environment:
      MUSIC_DIR: /srv/media
      DATA_DIR: /app/data
      APP_USER: ${APP_USER:?Set APP_USER in Portainer}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_AUTH_ENABLED: ${APP_AUTH_ENABLED:-false}
      APP_PORT: ${APP_PORT:-8788}
      OWNTONE_URL: ${OWNTONE_URL:-http://127.0.0.1:3689}
      CAST_STREAM_BASE_URL: ${CAST_STREAM_BASE_URL:-}
      LYRICS_ONLINE_ENABLED: ${LYRICS_ONLINE_ENABLED:-true}
      LYRICS_USER_AGENT: ${LYRICS_USER_AGENT:-AuroraMusic/0.3.1 (+https://github.com/santsasa/Aurora-Music)}
      RADIO_ENABLED: ${RADIO_ENABLED:-true}
      RADIO_USER_AGENT: ${RADIO_USER_AGENT:-AuroraMusic/0.3.1 (self-hosted radio directory)}
    volumes:
      - aurora_music:/srv/media:ro
      - aurora_data:/app/data
    depends_on:
      - owntone
  owntone:
    build: ./owntone
    pull_policy: build
    container_name: aurora-owntone
    network_mode: host
    restart: unless-stopped
    environment:
      UID: 1000
      GID: 1000
    volumes:
      - aurora_music:/srv/media:ro
      - aurora_owntone_cache_v2:/var/cache/owntone
    depends_on:
      owntone-cache-init:
        condition: service_completed_successfully
  owntone-cache-init:
    image: alpine:3.22
    container_name: aurora-owntone-cache-init
    restart: "no"
    command: ["sh", "-c", "mkdir -p /var/cache/owntone && chown -R 1000:1000 /var/cache/owntone"]
    volumes:
      - aurora_owntone_cache_v2:/var/cache/owntone

volumes:
  aurora_music:
  aurora_data:
  aurora_owntone_cache_v2:
