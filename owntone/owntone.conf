general {
  # Keep logs in the container temporary directory so the unprivileged service can create them.
  logfile = "/tmp/owntone.log"
  loglevel = "log"
}
library {
  name = "Aurora Music"
  directories = { "/srv/media" }
  follow_symlinks = false
}
audio {
  # Audio is delivered to network receivers only.
  type = "disabled"
}
