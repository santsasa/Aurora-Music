general {
  # Run the daemon as the account that owns its persistent cache.
  uid = "owntone"
  # Keep logs in the container temporary directory so the service account can create them.
  logfile = "/tmp/owntone.log"
  loglevel = "log"
}
library {
  name = "Aurora Music"
  directories = { "/srv/media" }
  follow_symlinks = false
}
audio {
  # Audio is delivered to network receivers only.
  type = "disabled"
}
