general {
  # Controlar solo desde tu red local; no redirigir puerto 3689 al exterior.
  # Keep logs writable for the unprivileged OwnTone process in Portainer.
  logfile = "/var/cache/owntone/owntone.log"
  loglevel = "log"
}
library {
  name = "Aurora Music"
  directories = { "/srv/media" }
  follow_symlinks = false
}
audio {
  # El servidor solo envía audio a receptores de red.
  type = "disabled"
}
