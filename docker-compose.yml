services:
  aurora:
    build: ./backend
    container_name: aurora-music
    network_mode: host
    restart: unless-stopped
    environment:
      MUSIC_DIR: /srv/media
      DATA_DIR: /app/data
      APP_USER: ${APP_USER:?Configurá APP_USER en .env}
      APP_PASSWORD: ${APP_PASSWORD:?Configurá APP_PASSWORD en .env}
      APP_PORT: ${APP_PORT:-8787}
      LAN_CA_PATH: /tls-ca/caddy/pki/authorities/local/root.crt
      OWNTONE_URL: http://127.0.0.1:3689
      CAST_STREAM_BASE_URL: ${CAST_STREAM_BASE_URL:-http://192.168.1.121:8787}
      LYRICS_ONLINE_ENABLED: ${LYRICS_ONLINE_ENABLED:-true}
      LYRICS_USER_AGENT: ${LYRICS_USER_AGENT:-AuroraMusic/0.3.2 (+https://github.com/santsasa/Aurora-Music)}
      RADIO_ENABLED: ${RADIO_ENABLED:-true}
      RADIO_USER_AGENT: ${RADIO_USER_AGENT:-AuroraMusic/0.3.2 (self-hosted radio directory)}
    volumes:
      - ${MUSIC_PATH:-./music}:/srv/media:ro
      - ./data:/app/data
      - aurora_caddy_data:/tls-ca:ro
    depends_on:
      - owntone
  aurora-https:
    image: caddy:2-alpine
    container_name: aurora-https
    network_mode: host
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT:-8787}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aurora_caddy_data:/data
      - aurora_caddy_config:/config
    depends_on:
      - aurora
  owntone:
    image: docker.io/owntone/owntone:latest
    container_name: aurora-owntone
    network_mode: host
    restart: unless-stopped
    environment:
      UID: ${PUID:-1000}
      GID: ${PGID:-1000}
    volumes:
  aurora_caddy_data:
  aurora_caddy_config:
      - ./owntone:/etc/owntone
      - ${MUSIC_PATH:-./music}:/srv/media:ro
      - ./owntone-cache:/var/cache/owntone
